    <h2 id="confirm-title"></h2>
    <p id="confirm-body"></p>
    <div class="confirm-actions">
      <button value="cancel" class="button quiet" id="confirm-cancel">Cancel</button>
      <button value="ok" class="button danger" id="confirm-ok">Confirm</button>
    </div>
  </form>
</dialog>
