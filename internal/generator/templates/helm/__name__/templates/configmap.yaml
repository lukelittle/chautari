apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chautari.fullname" . }}
  labels:
    {{- include "chautari.labels" . | nindent 4 }}
data:
  estate.cdl: |-
    {{- required "estate is required: install with --set-file estate=estate.cdl (the generated estate.cdl at the output root)" .Values.estate | nindent 4 }}
{{- if .Values.policies }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chautari.fullname" . }}-policy
  labels:
    {{- include "chautari.labels" . | nindent 4 }}
data:
  {{- range $file, $src := .Values.policies }}
  {{ $file }}: |-
    {{- $src | nindent 4 }}
  {{- end }}
{{- end }}
