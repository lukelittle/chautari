{{- if .Values.networkPolicy.enabled }}
# Only the checkpoint port is reachable. The data plane sidecar (3000, 3100)
# accepts nothing from outside the pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chautari.fullname" . }}
  labels:
    {{- include "chautari.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chautari.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
      {{- with .Values.networkPolicy.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
