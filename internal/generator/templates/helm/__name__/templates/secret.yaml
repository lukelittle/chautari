{{- if not .Values.existingSecret }}
{{- $name := include "chautari.fullname" . }}
{{- $prev := dict }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- $prev = .data | default dict }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "chautari.labels" . | nindent 4 }}
type: Opaque
data:
  CHAUTARI_DATABASE_URL: {{ required "database.url is required (e.g. postgres://chautari:PASSWORD@host:5432/chautari?sslmode=require), or set existingSecret" .Values.database.url | b64enc | quote }}
  {{- /* Generated credentials are kept across upgrades by looking up the live Secret. */}}
  {{- if .Values.secrets.adminTokens }}
  CHAUTARI_ADMIN_TOKENS: {{ .Values.secrets.adminTokens | b64enc | quote }}
  {{- else }}
  CHAUTARI_ADMIN_TOKEN: {{ .Values.secrets.adminToken | b64enc | default (get $prev "CHAUTARI_ADMIN_TOKEN") | default (randAlphaNum 48 | b64enc) | quote }}
  {{- end }}
  CHAUTARI_DIGEST_KEY: {{ .Values.secrets.digestKey | b64enc | default (get $prev "CHAUTARI_DIGEST_KEY") | default (randAlphaNum 48 | b64enc) | quote }}
  CHAUTARI_GATEWAY_KEY: {{ .Values.secrets.gatewayKey | b64enc | default (get $prev "CHAUTARI_GATEWAY_KEY") | default (randAlphaNum 48 | b64enc) | quote }}
  {{- range $env, $value := .Values.providerKeys }}
  {{- if $value }}
  {{ $env }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
