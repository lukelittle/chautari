# OpenTelemetry Collector for Himalayan Bank, generated by Chautari.
# Receives traces from the control plane and the data plane. The debug
# exporter keeps the demo self-contained; add your backend under exporters.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  resource:
    attributes:
      - key: chautari.estate
        value: "himalayan-bank"
        action: upsert
      - key: deployment.environment
        value: "demo"
        action: upsert

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [debug]
